<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Pronósticos Fútbol</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1020'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2339e58c' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1>Pronósticos Fútbol</h1>
  <div class="actions">
    <button id="btnRefresh" class="icon" aria-label="Actualizar datos" title="Actualizar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button id="btnWeek" class="icon" aria-label="Ver la semana" title="Semana">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
  </div>
</header>

<nav class="days" aria-label="Día">
  <button id="prevDay" class="arrow" aria-label="Día anterior">‹</button>
  <div class="dayLabel"><strong id="dayRel">Hoy</strong><span id="dayDate"></span></div>
  <button id="todayBtn" class="todayBtn">Hoy</button>
  <button id="nextDay" class="arrow" aria-label="Día siguiente">›</button>
</nav>

<div class="filters" role="tablist" aria-label="Filtros">
  <button class="chip active" data-filter="all">Todas</button>
  <button class="chip" data-filter="fav">★ Favoritas</button>
  <button class="chip" data-filter="alta">Confianza alta</button>
  <button class="chip" data-filter="media">Confianza media</button>
</div>
<div class="searchRow">
  <input id="search" type="search" placeholder="Buscar equipo o liga…" autocomplete="off" aria-label="Buscar equipo o liga">
</div>

<div id="banner" class="banner" hidden></div>
<main id="list" aria-live="polite"></main>

<section id="weekSheet" class="sheet" hidden>
  <div class="sheetCard">
    <div class="sheetHead"><strong>Semana</strong><button id="closeWeek" class="icon" aria-label="Cerrar">✕</button></div>
    <div id="weekList"></div>
  </div>
</section>

<footer class="foot">
  <div id="recordBox" class="record"></div>
  <div id="footMeta"></div>
  <details id="sourcesBox"><summary>Fuentes y validación del modelo</summary><div id="sourcesList"></div></details>
  <p class="legal">Estimaciones estadísticas pre-partido, sin garantía de resultado. No es asesoría de apuestas. Si apostar deja de ser un juego, busca ayuda.</p>
</footer>
<script src="app.js"></script>
</body>
</html>
